name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pre-pull and Prepare Docker Sandbox Image
      if: matrix.os == 'ubuntu-latest'
      run: |
        docker pull python:3.12-slim
        docker run --name prep_box python:3.12-slim pip install --no-cache-dir pytest
        docker commit prep_box python:3.12-slim
        docker rm -f prep_box

    - name: Run Unit & Adversarial Test Suite
      run: |
        pytest tests/ -v -k "not test_real_docker"

    - name: Run Live Docker Container Security Boundaries Integration Test
      if: matrix.os == 'ubuntu-latest'
      env:
        REQUIRE_DOCKER: "1"
      run: |
        pytest tests/ -v -k "test_real_docker or test_run_verification_tool_structured_record_e2e"

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install UI Dependencies
      working-directory: ui
      run: npm ci

    - name: Build & Typecheck UI
      working-directory: ui
      run: npm run build
